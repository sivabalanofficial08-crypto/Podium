<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Podium Speaking Coach</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8590c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar with view tabs; Practice view is a two-column stage (topic card + side panel) that stacks on phones. */
:root {
  /* Sunrise: ember orange drives action, gold rewards progress, warm ink grounds it. */
  --bg: #fff7ef;
  --surface: #ffffff;
  --surface-2: #fdeadb;
  --ink: #2b1810;
  --muted: #7a5c4b;
  --line: #f1d6c2;
  --accent: #e8590c;
  --accent-2: #f59f00;
  --accent-ink: #ffffff;
  --accent-soft: #ffe3cc;
  --energy: linear-gradient(120deg, #f76707 0%, #e8590c 45%, #d6336c 100%);
  --glow: 0 6px 18px -6px rgba(232, 89, 12, .55);
  --onair: #e03131;
  --good: #2b8a3e;
  --good-soft: #e3f4e1;
  --warn: #c76a00;
  --warn-soft: #fff0cc;
  --bad: #c92a2a;
  --bad-soft: #ffe0dd;
  --hl-filler: #ffd3c9;
  --hl-hedge: #ffe8a8;
  --hl-power: #d3f0cf;
  --hl-vocab: #ffd8b8;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a110d; --surface: #241812; --surface-2: #33221a; --ink: #fbeee4; --muted: #c4a491; --line: #4a3226;
    --accent: #ff8a3d; --accent-2: #ffc145; --accent-ink: #2b1306; --accent-soft: #4a2614; --onair: #ff6b6b;
    --energy: linear-gradient(120deg, #ff922b 0%, #ff7a2f 45%, #f06595 100%); --glow: 0 6px 20px -6px rgba(255, 138, 61, .5);
    --good: #69db7c; --good-soft: #1e3a22; --warn: #ffc145; --warn-soft: #43320f; --bad: #ff8787; --bad-soft: #4a1f1c;
    --hl-filler: #6b2a22; --hl-hedge: #5a4512; --hl-power: #234a2a; --hl-vocab: #5a3214;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a110d; --surface: #241812; --surface-2: #33221a; --ink: #fbeee4; --muted: #c4a491; --line: #4a3226;
  --accent: #ff8a3d; --accent-2: #ffc145; --accent-ink: #2b1306; --accent-soft: #4a2614; --onair: #ff6b6b;
  --energy: linear-gradient(120deg, #ff922b 0%, #ff7a2f 45%, #f06595 100%); --glow: 0 6px 20px -6px rgba(255, 138, 61, .5);
  --good: #69db7c; --good-soft: #1e3a22; --warn: #ffc145; --warn-soft: #43320f; --bad: #ff8787; --bad-soft: #4a1f1c;
  --hl-filler: #6b2a22; --hl-hedge: #5a4512; --hl-power: #234a2a; --hl-vocab: #5a3214;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1180px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--energy); display: inline-block; transform: translateY(-2px); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 -2px 0 var(--accent); }
.streak { font-size: 13px; color: var(--muted); }

main { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 64px; }
.view[hidden] { display: none; }

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--energy); color: #fff; border-color: transparent; box-shadow: var(--glow); }
.btn.primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn.primary:active { transform: none; }

/* Daily goal strip */
.goal { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 20px; margin-bottom: 18px; position: relative; overflow: hidden; }
.goal::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--energy); }
.goal.done::before { background: var(--good); }
@media (max-width: 720px) { .goal { grid-template-columns: minmax(0, 1fr); gap: 12px; } }
.flame { display: flex; align-items: center; gap: 10px; }
.flame svg { width: 34px; height: 34px; flex: none; }
.flame b { font-family: var(--font-display); font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.flame span { font-size: 12.5px; color: var(--muted); display: block; }
.week { display: flex; gap: 8px; flex-wrap: wrap; }
.day { display: grid; justify-items: center; gap: 4px; font-size: 11px; color: var(--muted); font-weight: 600; }
.day i { width: 26px; height: 26px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-style: normal; font-size: 12px; }
.day.hit i { background: var(--energy); border: 0; color: #fff; }
.day.today i { border-color: var(--accent); border-style: solid; }
.day.today { color: var(--accent); }
.goal-msg { max-width: 34ch; }
.goal-msg b { display: block; font-family: var(--font-display); font-size: 16px; }
.goal-msg span { font-size: 13px; color: var(--muted); }
.btn.rec { background: var(--onair); border-color: var(--onair); color: #fff; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.big { padding: 13px 22px; font-size: 16px; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; }
input[type=text], input[type=password], input[type=search], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%;
}
textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Mode picker */
.modes { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.mode { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.mode:hover { border-color: var(--muted); }
.mode[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.side { display: grid; gap: 16px; }

/* Topic card: the "cue card" on the lectern */
.cue { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 30px 24px; min-width: 0; position: relative; overflow: hidden; }
.cue::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--energy); }
@media (max-width: 560px) { .cue { padding: 24px 18px 20px; } }
.cue-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.cue-topic { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 3.6vw, 40px); letter-spacing: -.015em; line-height: 1.12; margin: 18px 0 10px; text-wrap: balance; }
.cue-blurb { color: var(--muted); max-width: 62ch; }
.cue-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.fw { margin-top: 22px; border-top: 1px dashed var(--line); padding-top: 16px; }
.fw-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
.fw-step { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; }
.fw-step b { display: block; font-family: var(--font-display); font-size: 15px; margin-bottom: 2px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); font-weight: 600; }
.chip.accent { background: var(--accent-soft); color: var(--accent); }

.vocab-targets { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 16px; }
.vt { border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.vt h4 { font-size: 19px; }
.vt .pos { font-size: 12px; color: var(--muted); font-style: italic; }
.vt p { font-size: 13.5px; margin-top: 4px; }
.vt .ex { color: var(--muted); font-style: italic; }

.research { margin-top: 18px; display: grid; gap: 14px; }
.research ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.research .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.research .links a { font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; }

/* Live session */
.live { display: grid; gap: 18px; }
.live-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
.onair { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-weight: 600; font-size: 13px; letter-spacing: .1em; padding: 5px 10px; border-radius: 6px; border: 1.5px solid var(--onair); color: var(--onair); }
.onair.on { background: var(--onair); color: #fff; }
.onair .blink { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.onair.on .blink { animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.clock { font-family: var(--font-mono); font-size: 54px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.clock.prep { color: var(--warn); }
.progress-bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress-bar > div { height: 100%; background: var(--accent); width: 0; transition: width .25s linear; }
.meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.meter { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.meter .v { font-family: var(--font-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.meter .hint { font-size: 12px; color: var(--muted); }
.level { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.level > div { height: 100%; width: 0; background: var(--good); transition: width .08s; }
.transcript-live { min-height: 140px; max-height: 300px; overflow: auto; background: var(--surface-2); border-radius: 8px; padding: 14px; line-height: 1.7; }
.transcript-live .interim { color: var(--muted); }
.notice { background: var(--warn-soft); color: var(--ink); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.notice.bad { background: var(--bad-soft); }

/* Results */
.results { display: grid; gap: 20px; margin-top: 20px; }
.score-row { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; align-items: center; }
@media (max-width: 640px) { .score-row { grid-template-columns: minmax(0, 1fr); } }
.ring { position: relative; width: 170px; height: 170px; margin: 0 auto; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .num b { font-family: var(--font-display); font-size: 52px; font-weight: 800; line-height: 1; display: block; }
.ring .num span { font-size: 12px; color: var(--muted); display: block; margin-top: 4px; }
.subs { display: grid; gap: 9px; }
.sub { display: grid; grid-template-columns: 110px minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 14px; }
.sub .bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.sub .bar > div { height: 100%; border-radius: 4px; }
.sub .n { text-align: right; font-family: var(--font-mono); font-weight: 600; }
.verdict { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin-bottom: 4px; }

.fb-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .fb-grid { grid-template-columns: minmax(0, 1fr); } }
.fb { border-radius: var(--radius); padding: 16px 18px; border: 1px solid var(--line); background: var(--surface); }
.fb h3 { font-size: 17px; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.fb h3 .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.fb ul { margin: 0; padding-left: 18px; display: grid; gap: 7px; font-size: 14.5px; }
.fb.great h3 .sw { background: var(--good); }
.fb.wrong h3 .sw { background: var(--bad); }
.fb.missing h3 .sw { background: var(--warn); }
.fb.improve h3 .sw { background: var(--accent); }

.stats-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.stats-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.stats-table td:nth-child(2) { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.table-wrap { overflow-x: auto; }

.marked { line-height: 1.85; font-size: 15px; }
.marked mark { border-radius: 3px; padding: 1px 2px; color: inherit; }
.marked mark.f { background: var(--hl-filler); }
.marked mark.h { background: var(--hl-hedge); }
.marked mark.p { background: var(--hl-power); }
.marked mark.v { background: var(--hl-vocab); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }

.coach-out { line-height: 1.65; }
.coach-out h2, .coach-out h3 { font-size: 18px; margin: 18px 0 6px; }
.coach-out ul, .coach-out ol { padding-left: 20px; margin: 6px 0; }
.coach-out p { margin: 6px 0; }
.coach-out blockquote { margin: 8px 0; padding: 8px 14px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; }

.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.section-head h2 { font-size: 22px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Progress */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.tile .v { font-family: var(--font-display); font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); }
.charts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
@media (max-width: 900px) { .charts { grid-template-columns: minmax(0, 1fr); } }
.chart svg { width: 100%; height: auto; display: block; }
.chart svg text { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.hist { display: grid; gap: 8px; margin-top: 14px; }
.hist-item { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; text-align: left; width: 100%; }
.hist-item:hover { border-color: var(--muted); }
.hist-item .sc { font-family: var(--font-display); font-weight: 800; font-size: 24px; text-align: center; }
.hist-item .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }

/* Vocab */
.vocab-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-top: 14px; }
.vcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.vcard.learned { border-color: var(--good); }
.vcard h4 { font-size: 19px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.vcard .ex { color: var(--muted); font-style: italic; font-size: 13.5px; }
.vcard .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 12.5px; }
.vcard label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.wotd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
@media (max-width: 640px) { .wotd { grid-template-columns: minmax(0, 1fr); } }
.wotd h3 { font-size: 34px; }

/* Toolkit */
.kit { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .kit { grid-template-columns: minmax(0, 1fr); } }
.kit .panel h3 { font-size: 19px; margin-bottom: 8px; }
.kit ol, .kit ul { margin: 0; padding-left: 20px; display: grid; gap: 5px; font-size: 14.5px; }
.swap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
.swap .from { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1px; }
.swap .to { color: var(--good); font-weight: 600; }

.settings { display: grid; gap: 16px; max-width: 640px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-weight: 600; z-index: 50; }
.confirm-box { background: var(--bad-soft); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; }
kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="dot"></span><h1>Podium</h1><span class="streak" id="streakLabel"></span></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="practice" aria-selected="true">Practice</button>
      <button class="tab" role="tab" data-view="progress" aria-selected="false">Progress</button>
      <button class="tab" role="tab" data-view="vocab" aria-selected="false">Vocabulary</button>
      <button class="tab" role="tab" data-view="toolkit" aria-selected="false">Toolkit</button>
      <button class="tab" role="tab" data-view="settings" aria-selected="false">Settings</button>
    </nav>
  </div>
</header>

<main>
  <!-- PRACTICE -->
  <section class="view" id="view-practice">
    <div class="goal" id="goal"></div>
    <div class="modes" id="modes"></div>
    <div class="stage">
      <div style="min-width:0">
        <div class="cue" id="cue"></div>
        <div class="panel live" id="live" hidden></div>
        <div class="results" id="results" hidden></div>
      </div>
      <aside class="side" id="side">
        <div class="panel">
          <div class="label" style="margin-bottom:10px">Session setup</div>
          <div style="display:grid;gap:14px">
            <div class="field"><span>Prep time</span><div class="seg" id="prepSeg"></div></div>
            <div class="field"><span>Speaking time</span><div class="seg" id="speakSeg"></div></div>
            <div class="field"><span>Input</span><div class="seg" id="inputSeg"></div></div>
          </div>
          <p class="small muted" id="micNote" style="margin-top:12px"></p>
        </div>
        <div class="panel">
          <div class="label">Today's challenge</div>
          <h3 style="font-size:18px;margin:8px 0 6px" id="dailyTitle"></h3>
          <p class="small muted" id="dailyMode"></p>
          <button class="btn" style="margin-top:12px" id="dailyBtn">Load challenge</button>
        </div>
        <div class="panel">
          <div class="label">Warm-up (60 sec)</div>
          <h3 style="font-size:18px;margin:8px 0 6px" id="warmTitle"></h3>
          <p class="small" id="warmBody"></p>
          <button class="btn ghost" style="margin-top:8px;padding-left:0" id="warmNext">Another warm-up</button>
        </div>
      </aside>
    </div>
  </section>

  <!-- PROGRESS -->
  <section class="view" id="view-progress" hidden></section>

  <!-- VOCAB -->
  <section class="view" id="view-vocab" hidden></section>

  <!-- TOOLKIT -->
  <section class="view" id="view-toolkit" hidden></section>

  <!-- SETTINGS -->
  <section class="view" id="view-settings" hidden></section>
</main>

<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="analyze.js"></script>
<script src="app.js"></script>
</body>
</html>
